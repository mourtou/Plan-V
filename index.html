<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Plan V Healthy Bakery – Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ac:#2f7a45;--ac-soft:#e5f1e8;--ink:#1f2933;--sub:#6b7a8c;--line:#e8ebef;--bg:#f6f7f9;--ff:'Open Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#fff}
body{font-family:var(--ff);color:var(--ink);max-width:560px;margin:0 auto;min-height:100vh;position:relative}
button{font-family:var(--ff);cursor:pointer}
.view{display:none;min-height:100vh}
.view.on{display:block}
.circ{width:40px;height:40px;border-radius:50%;border:0;background:rgba(240,242,245,.92);display:grid;place-items:center;color:var(--ac);flex:none}
.circ svg{width:20px;height:20px}

/* HOME */
.hbar{position:sticky;top:0;z-index:10;background:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.hbar img{width:44px;height:44px;border-radius:50%}
.hbar h1{flex:1;font-size:17px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banners{padding:16px 16px 90px;background:var(--bg);min-height:calc(100vh - 64px)}
.banner{position:relative;display:block;width:100%;border:0;background:none;margin-bottom:34px;text-align:left}
.banner .ph{width:100%;aspect-ratio:2/1;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.banner .ph img{width:100%;height:100%;object-fit:cover;display:block}
.banner .ph::after{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.28))}
.pill{position:absolute;left:12px;right:12px;bottom:-12px;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;padding:9px 40px;z-index:1}
.pill span{color:var(--ac);font-weight:700;font-size:15px;letter-spacing:.4px;text-transform:uppercase}
.pill svg{position:absolute;right:12px;width:18px;height:18px;color:var(--ac)}
.brandfoot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:#fff;text-align:center;padding:8px 0 10px;font-weight:800;color:var(--ac);letter-spacing:.5px;font-size:15px;box-shadow:0 -2px 6px rgba(0,0,0,.05);z-index:5}
.brandfoot small{display:block;font-weight:500;color:var(--sub);font-size:11px;letter-spacing:0}

/* MENU PAGE */
.hero{position:relative;height:150px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .tl,.hero .tr{position:absolute;top:12px;display:flex;gap:8px}
.hero .tl{left:16px}.hero .tr{right:16px}
.mhead{display:flex;align-items:center;gap:18px;padding:14px 16px 6px}
.mhead img{width:66px;height:66px;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.mhead h2{font-size:22px;font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.seeall{display:flex;justify-content:flex-end;padding:18px 16px 10px}
.seeall button{border:0;background:none;color:var(--ac);font-weight:700;font-size:18px}
.cards{display:flex;gap:16px;overflow-x:auto;padding:4px 16px 14px;scrollbar-width:none;scroll-snap-type:x mandatory;scroll-padding-left:16px}
.cards::-webkit-scrollbar{display:none}
.card{flex:none;width:132px;border:0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.18);scroll-snap-align:start;text-align:center}
.card img{width:132px;height:106px;object-fit:cover;display:block}
.card span{display:block;font-size:11px;font-weight:700;text-transform:uppercase;padding:8px 6px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:3px;background:var(--line);margin:0 0 0}
.track i{display:block;height:3px;background:var(--ac);width:25%;transition:transform .08s linear}
.hours{padding:22px 16px 6px;color:var(--sub);font-size:14px}
.hours u{display:block;margin-bottom:10px}
.hours #hoursRows>div{display:grid;grid-template-columns:110px 1fr;padding:6px 0}
.mnote{margin:16px 16px 0;padding-bottom:18px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600;line-height:1.35}
.delivery{padding:18px 16px 100px;color:var(--sub);font-size:14px}
.delivery b{color:var(--ink);display:block;margin-bottom:8px}
.dchips{display:flex;gap:8px;flex-wrap:wrap}
.dchips span{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600;color:var(--ink);font-size:13px}

/* LIST */
.lbar{position:sticky;top:0;z-index:10;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 16px 4px}
.catbtn{flex:1;border:0;background:none;font-size:20px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
.catbtn svg{width:14px;height:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 12px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;color:var(--ac);font-weight:700;font-size:16px;text-transform:uppercase;padding:4px 6px 6px;position:relative;white-space:nowrap}
.tab.on{background:var(--ac-soft);border-radius:4px 4px 0 0}
.tab.on::after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:3px;background:#9aa5b1;border-radius:2px}
.sec{scroll-margin-top:96px;padding-top:26px}
.sech{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.sech::before{content:"";flex:1;height:4px;background:var(--ac)}
.sech h3{color:var(--ac);font-weight:600;font-size:22px;text-transform:uppercase;padding-right:16px;letter-spacing:.2px;max-width:75%;text-align:right;line-height:1.15}
.grp{padding:14px 16px 2px;font-size:12.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--sub)}
.gnote{padding:2px 16px 4px;font-size:13px;color:var(--sub)}
.it{display:flex;gap:12px;margin:0 16px;padding:14px 0;border-bottom:1px solid var(--line)}
.it .tx{flex:1;min-width:0}
.it .nm{font-size:16px;font-weight:500;line-height:1.25}
.it .ds{font-size:13.5px;font-weight:700;color:var(--sub);margin-top:6px;line-height:1.45}
.it .pr{color:var(--ac);font-weight:700;font-size:15px;margin-top:8px}
.it .pr span{display:inline-block;margin-right:14px}
.it .pr small{color:var(--sub);font-weight:600;font-size:12px;margin-right:4px}
.it .th{width:112px;height:112px;border-radius:10px;overflow:hidden;flex:none;align-self:flex-start}
.it .th img{width:100%;height:100%;object-fit:cover}
.ic{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ic span{height:26px;border-radius:6px;padding:0 8px;display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;color:#fff;background:#4c9a2a}
.ic .new{background:#e8912d}.ic .sf{background:#3b82c4}.ic .pt{background:#7a5c3e}
.endpad{height:60vh}

/* SHEETS */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:560px;background:#fff;border-radius:18px 18px 0 0;z-index:41;transition:transform .25s ease;max-height:82vh;overflow:auto;padding:8px 0 24px}
.sheet.on{transform:translate(-50%,0)}
.grab{width:40px;height:4px;border-radius:2px;background:#d4d9df;margin:4px auto 12px}
.sheet h4{font-size:17px;padding:4px 20px 10px}
.slist button{display:flex;width:100%;align-items:center;gap:14px;border:0;background:none;padding:10px 20px;font-size:15px;font-weight:600;color:var(--ink);text-align:left}
.slist img{width:46px;height:46px;border-radius:8px;object-fit:cover}
.info{padding:0 20px;font-size:14.5px;color:var(--ink)}
.info .row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.info .row b{display:block;margin-bottom:2px}
.info a{color:var(--ac);font-weight:600;text-decoration:none}
.lang{display:flex;gap:8px;margin-top:6px}
.lang button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 16px;font-weight:700;color:var(--ink)}
.lang button.on{background:var(--ac);border-color:var(--ac);color:#fff}

/* SEARCH */
.srch{position:fixed;inset:0;z-index:50;background:#fff;display:none;flex-direction:column;max-width:560px;margin:0 auto}
.srch.on{display:flex}
.sbar{display:flex;gap:10px;align-items:center;padding:10px 16px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.sbar input{flex:1;border:0;outline:0;font:500 17px var(--ff);background:var(--bg);border-radius:10px;padding:10px 14px;color:var(--ink);min-width:0}
.sres{overflow:auto;flex:1;padding-bottom:30px}
.sres .where{font-size:11.5px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.sempty{padding:40px 20px;text-align:center;color:var(--sub)}
mark{background:#fff3b0;color:inherit}
</style>
</head>

function hl(t,q){if(!q)return esc(t);const n=norm(t),k=norm(q),a=n.indexOf(k);if(a<0)return esc(t);return esc(t.slice(0,a))+"<mark>"+esc(t.slice(a,a+q.length))+"</mark>"+esc(t.slice(a+q.length))}
function price(p){const T=UI[lang];if(p==null)return `<span><small>${T.ask}</small></span>`;if(typeof p==="number")return `<span>${eur(p)}</span>`;return p.map(r=>`<span><small>${lang==="en"?r[0]:r[1]}</small>${eur(r[2])}</span>`).join("")}

function itemHTML(it,q,where){
  const d=lang==="en"?it.de:it.dl;

}

function renderList(){

}
let obs;
function setTab(id){document.querySelectorAll(".tab").forEach(t=>{const on=t.dataset.tab===id;t.classList.toggle("on",on);if(on){const p=t.parentElement;p.scrollTo({left:t.offsetLeft-12,behavior:"smooth"})}})}
function spy(){if(obs)obs.disconnect();obs=new IntersectionObserver(es=>{const v=es.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(v[0])setTab(v[0].target.id.slice(2))},{rootMargin:"-100px 0px -65% 0px"});document.querySelectorAll(".sec").forEach(s=>obs.observe(s));setTab(cur.subs[0])}
function goSub(s){const el=document.getElementById("s-"+s);if(!el)return;const off=$(".lbar").offsetHeight;window.scrollTo({top:el.getBoundingClientRect().top+scrollY-off+2,behavior:"smooth"})}

function show(v){document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id==="v-"+v))}
function route(){
  const h=location.hash.slice(1);closeSheets();
  const lm=h.endsWith("-list")?h.slice(0,-5):null;
  const m=MENUS.find(x=>x.id===(lm||h));
  if(m&&lm){cur=m;renderList();show("list");scrollTo(0,0);if(pendingSub){const s=pendingSub;pendingSub=null;requestAnimationFrame(()=>{const el=document.getElementById("s-"+s);if(el)scrollTo(0,el.getBoundingClientRect().top+scrollY-$(".lbar").offsetHeight+2)})}}
  else if(m){cur=m;renderMenu();show("menu");scrollTo(0,0)}
  else{renderHome();show("home");scrollTo(0,0)}
}
let pendingSub=null;
function nav(h){if(location.hash==="#"+h)route();else location.hash=h}

  if(!k){$("#sres").innerHTML="";return}
  let out="";
  for(const m of MENUS)for(const s of m.subs){const c=SUB[s];for(const gr of c.groups)for(const it of gr.items){
    if([it.en,it.el,it.de,it.dl].some(x=>norm(x).includes(k)))out+=itemHTML(it,q,L(c)+(c.groups.length>1?" · "+L(gr):""))}}
  $("#sres").innerHTML=out||`<div class="sempty">${T.noRes} “${esc(q)}”</div>`;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act],[data-menu],[data-sub],[data-tab],[data-l]");if(!b)return;
  if(b.dataset.menu)return nav(b.dataset.menu);
  if(b.dataset.l){lang=b.dataset.l;try{localStorage.setItem("pv-lang",lang)}catch(_){}texts();const v=document.querySelector(".view.on").id;if(v==="v-home")renderHome();if(v==="v-menu")renderMenu();if(v==="v-list"){const y=scrollY;renderList();scrollTo(0,y)}doSearch();return}
  if(b.dataset.tab)return goSub(b.dataset.tab);
  if(b.dataset.sub){if(document.querySelector(".view.on").id==="v-list"){closeSheets();goSub(b.dataset.sub)}else{pendingSub=b.dataset.sub;nav(cur.id+"-list")}return}
  const a=b.dataset.act;
  if(a==="home")nav("home");
  if(a==="back")nav(cur.id);
  if(a==="seeall")nav(cur.id+"-list");
  if(a==="cats")openSheet("#sheetCats");
  if(a==="info")openSheet("#sheetInfo");
  if(a==="search"){$("#srch").classList.add("on");$("#q").focus()}
  if(a==="closesearch"){$("#srch").classList.remove("on")}
});
$("#scrim").onclick=closeSheets;
$("#q").addEventListener("input",doSearch);
$("#cards").addEventListener("scroll",track,{passive:true});
addEventListener("resize",()=>{if(cur)track()});
addEventListener("hashchange",route);
texts();route();
</script>
</body>
